[workspace]
members = ["rmeter-component","rmeter-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Tony Reeves"]
license = "GPL-v3"

[workspace.dependencies]
tokio = {version = "1", features = ["full"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
