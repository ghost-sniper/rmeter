[package]
name = "rmeter-component"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rmeter-core = { path = "../rmeter-core" }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "query", "form", "json"] }
serde_json.workspace = true
serde_json_path = "0.7"
regex = "1"
sxd-document = "0.3"
sxd-xpath = "0.4"
tokio.workspace = true
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
deadpool-postgres = "0.14"
postgres-native-tls = "0.5"
native-tls = "0.2"
futures-util = "0.3"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = "1"
boa_engine = { version = "0.22", default-features = false }

[dev-dependencies]
tokio.workspace = true
