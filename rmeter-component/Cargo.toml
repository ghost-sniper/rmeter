[package]
name = "rmeter-component"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rmeter-core = { path = "../rmeter-core" }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "query", "form", "json"] }
serde_json.workspace = true
serde_json_path = "0.7"
regex = "1"
sxd-document = "0.3"
sxd-xpath = "0.4"
tokio.workspace = true
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
deadpool-postgres = "0.14"
postgres-native-tls = "0.5"
native-tls = "0.2"
futures-util = "0.3"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = "1"
serde = { workspace = true, features = ["rc"] }
rquickjs = "0.14"
xee-xpath = "0.1.5"
jmespath = "0.5"
rand = "0.10"

[[bin]]
name = "rmeter-js-worker"
path = "src/bin/rmeter-js-worker.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
